name: Test and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e '.[search]'

      - name: Run tests
        run: python -m unittest discover -s tests -v

  deploy:
    name: Deploy to EC2
    needs: test
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: job-agent-production
      cancel-in-progress: false

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Start EC2 deployment
        id: deployment
        shell: bash
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "JobAgentDeploy" \
              --parameters "{\"CommitSha\":[\"${GITHUB_SHA}\"]}" \
              --comment "Deploy ${GITHUB_SHA}" \
              --query "Command.CommandId" \
              --output text
          )"

          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"

      - name: Wait for EC2 deployment
        shell: bash
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          COMMAND_ID: ${{ steps.deployment.outputs.command_id }}
        run: |
          set -euo pipefail

          status="Pending"

          for attempt in $(seq 1 180); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "Status" \
                --output text 2>/dev/null || true
            )"

            case "$status" in
              Success|Failed|Cancelled|TimedOut|Undeliverable|Terminated)
                break
                ;;
            esac

            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{
              Status:Status,
              Output:StandardOutputContent,
              Error:StandardErrorContent
            }' \
            --output json || true

          if [ "$status" != "Success" ]; then
            echo "Deployment failed with status: $status"
            exit 1
          fi